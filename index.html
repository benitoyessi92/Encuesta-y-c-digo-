<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Encuesta de Salud - Actividades</title>
    <style>
        :root {
            --morado-hobi: #7b68ee;
            --fondo: #f8f9ff;
            --texto: #2d2d2d;
            --error: #e74c3c;
            --success: #27ae60;
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--fondo);
            color: var(--texto);
            line-height: 1.6;
            padding: 20px;
        }
        
        .container {
            max-width: 700px; 
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(123, 104, 238, 0.15);
        }
        
        h1 {
            text-align: center;
            color: var(--morado-hobi);
            margin-bottom: 30px;
        }
        
        h2 {
            color: var(--morado-hobi);
            border-bottom: 2px solid var(--morado-hobi);
            padding-bottom: 8px;
            margin-bottom: 20px;
            font-size: 1.3rem;
        }
        
        .actividad {
            border: 2px solid #e8e5ff;
            padding: 25px;
            margin-bottom: 30px;
            border-radius: 10px;
            transition: border-color 0.3s;
        }
        
        .actividad:hover {
            border-color: var(--morado-hobi);
        }
        
        label { 
            display: block; 
            margin-top: 18px; 
            font-weight: 600;
            margin-bottom: 6px;
        }
        
        input, select { 
            width: 100%; 
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        
        input:focus, select:focus {
            outline: none;
            border-color: var(--morado-hobi);
            box-shadow: 0 0 0 3px rgba(123, 104, 238, 0.1);
        }
        
        input:invalid {
            border-color: var(--error);
        }
        
        input:valid {
            border-color: var(--success);
        }
        
        input[type="range"] {
            padding: 0;
            height: 8px;
            background: #ddd;
            border-radius: 5px;
            accent-color: var(--morado-hobi);
        }
        
        .valor-dolor {
            display: inline-block;
            background: var(--morado-hobi);
            color: white;
            padding: 2px 10px;
            border-radius: 20px;
            font-weight: bold;
            margin-left: 8px;
        }
        
        .emoji-dolor {
            font-size: 1.5rem;
            margin-left: 10px;
        }
        
        small {
            color: #666;
            font-size: 0.85rem;
            display: block;
            margin-top: 4px;
        }
        
        .error-msg {
            color: var(--error);
            font-size: 0.85rem;
            margin-top: 4px;
            display: none;
        }
        
        button {
            background: var(--morado-hobi);
            color: white;
            padding: 14px 30px;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            transition: transform 0.2s, background 0.3s;
        }
        
        button:hover {
            background: #6a5acd;
            transform: translateY(-2px);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        .success-msg {
            background: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 6px;
            margin-top: 20px;
            display: none;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Encuesta de Salud 💜</h1>
        
        <form id="formSalud">
            <!-- ACTIVIDAD 1: 450,000 pts -->
            <div class="actividad">
                <h2>Actividad 1: Encuesta de Salud</h2>
                
                <!-- input type="number" con min/max -->
                <label for="edad">Edad:</label>
                <input type="number" id="edad" name="edad" min="0" max="120" required>
                
                <label for="peso">Peso en kg:</label>
                <input type="number" id="peso" name="peso" min="1" max="300" step="0.1" required>
                
                <!-- input type="range" para nivel de dolor -->
                <label for="dolor">
                    Nivel de dolor: 
                    <span class="valor-dolor" id="valorDolor">5</span>
                    <span class="emoji-dolor" id="emojiDolor">😣</span>
                </label>
                <input type="range" id="dolor" name="dolor" min="0" max="10" value="5">
                
                <!-- select para tipo de sangre -->
                <label for="sangre">Tipo de sangre:</label>
                <select id="sangre" name="sangre" required>
                    <option value="">Selecciona tu tipo</option>
                    <option value="A+">A+</option>
                    <option value="A-">A-</option>
                    <option value="B+">B+</option>
                    <option value="B-">B-</option>
                    <option value="AB+">AB+</option>
                    <option value="AB-">AB-</option>
                    <option value="O+">O+</option>
                    <option value="O-">O-</option>
                </select>
            </div>

            <!-- ACTIVIDAD 2: 450,000 pts -->
            <div class="actividad">
                <h2>Actividad 2: Código Postal</h2>
                
                <!-- pattern para exactamente 5 números -->
                <label for="cp">Código Postal:</label>
                <input type="text" id="cp" name="cp" 
                       pattern="[0-9]{5}" 
                       maxlength="5"
                       placeholder="Ej: 91000"
                       title="Debe contener exactamente 5 números"
                       required>
                <small>Formato: 5 dígitos numéricos</small>
                <div class="error-msg" id="errorCP">El código postal debe tener exactamente 5 números</div>
            </div>
            
            <button type="submit">Enviar Encuesta</button>
            <div class="success-msg" id="successMsg">¡Formulario enviado correctamente! 💜</div>
        </form>
    </div>

    <script>
        // Actualizar valor del range de dolor + emoji
        const dolorInput = document.getElementById('dolor');
        const valorDolor = document.getElementById('valorDolor');
        const emojiDolor = document.getElementById('emojiDolor');
        
        const emojis = ['😄','🙂','😐','😕','😟','😣','😖','😫','😭','😵','💀'];
        
        dolorInput.addEventListener('input', function() {
            valorDolor.textContent = this.value;
            emojiDolor.textContent = emojis[this.value];
        });
        
        // Validación en tiempo real del Código Postal
        const cpInput = document.getElementById('cp');
        const errorCP = document.getElementById('errorCP');
        
        cpInput.addEventListener('input', function() {
            // Solo permite números
            this.value = this.value.replace(/[^0-9]/g, '');
            
            // Muestra error si no son 5 dígitos
            if (this.value.length > 0 && this.value.length !== 5) {
                errorCP.style.display = 'block';
            } else {
                errorCP.style.display = 'none';
            }
        });
        
        // Validar formulario al enviar
        document.getElementById('formSalud').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Revisa si el CP tiene 5 dígitos
            if (cpInput.value.length !== 5) {
                errorCP.style.display = 'block';
                cpInput.focus();
                return;
            }
            
            // Si todo está bien
            document.getElementById('successMsg').style.display = 'block';
            console.log('Datos enviados:', Object.fromEntries(new FormData(this)));
            
            // Resetear después de 3 seg
            setTimeout(() => {
                this.reset();
                valorDolor.textContent = '5';
                emojiDolor.textContent = '😣';
                document.getElementById('successMsg').style.display = 'none';
            }, 3000);
        });
    </script>
</body>
</html>
